ill="none" stroke="#2fe0cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></g><text x="484" y="430" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#eaf0ee">Private by default</text><text x="484" y="462" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8d9aa3">Run it offline and nothing leaves your</text><text x="484" y="486" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8d9aa3">PC. Keys are encrypted.</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="7s" begin="2.5s" repeatCount="indefinite"/><rect x="868" y="296" width="392" height="236" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity=".08"/><rect x="868" y="296" width="392" height="236" rx="20" fill="none" stroke="url(#edge)" stroke-width="2" stroke-dasharray="90 1256" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="0;-1346" dur="9s" begin="6.0s" repeatCount="indefinite"/></rect><circle cx="922" cy="358" r="30" fill="#2fe0cc" opacity=".1"/><circle cx="922" cy="358" r="30" fill="none" stroke="#2fe0cc" stroke-opacity=".45"><animate attributeName="r" values="30;36;30" dur="3s" begin="2.0s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".5;0;.5" dur="3s" begin="2.0s" repeatCount="indefinite"/></circle><g transform="translate(908 344) scale(1.1666666666666667)" fill="none" stroke="#2fe0cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.3A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></g><text x="900" y="430" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#eaf0ee">Your choice of engine</text><text x="900" y="462" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8d9aa3">Whisper and Ollama on your PC, or Claude</text><text x="900" y="486" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8d9aa3">and ChatGPT with your own key.</text></g></svg>