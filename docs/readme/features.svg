d writes a short</text><text x="68" y="226" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8d9aa3">answer you can say out loud.</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="6s" begin="0.5s" repeatCount="indefinite"/><rect x="452" y="36" width="392" height="236" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity=".08"/><rect x="452" y="36" width="392" height="236" rx="20" fill="none" stroke="url(#edge)" stroke-width="2" stroke-dasharray="90 1256" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="0;-1346" dur="9s" begin="1.2s" repeatCount="indefinite"/></rect><circle cx="506" cy="98" r="30" fill="#2fe0cc" opacity=".1"/><circle cx="506" cy="98" r="30" fill="none" stroke="#2fe0cc" stroke-opacity=".45"><animate attributeName="r" values="30;36;30" dur="3s" begin="0.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".5;0;.5" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle><g transform="translate(492 84) scale(1.1666666666666667)" fill="none" stroke="#2fe0cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></g><text x="484" y="170" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#eaf0ee">Notes that write themselves</text><text x="484" y="202" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8d9aa3">Summary, decisions, action items and</text><text x="484" y="226" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8d9aa3">open questions, kept up to date.</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="7s" begin="1.0s" repeatCount="indefinite"/><rect x="868" y="36" width="392" height="236" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity=".08"/><rect x="868" y="36" width="392" height="236" rx="20" fill="none" stroke="url(#edge)" stroke-width="2" stroke-dasharray="90 1256" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="0;-1346" dur="9s" begin="2.4s" repeatCount="indefinite"/></rect><circle cx="922" cy="98" r="30" fill="#2fe0cc" opacity=".1"/><circle cx="922" cy="98" r="30" fill="none" stroke="#2fe0cc" stroke-opacity=".45"><animate attributeName="r" values="30;36;30" dur="3s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".5;0;.5" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle><g transform="translate(908 84) scale(1.1666666666666667)" fill="none" stroke="#2fe0cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/><line x1="8" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="13" y2="18"/></g><text x="900" y="170" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="23" font-weight="700" fill="#eaf0ee">Answers from your files</text><text x="900" y="202" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8d9aa3">PDF, Excel, CSV, Word and text. It names</text><text x="900" y="226" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#8d9aa3">the file it used.</text></g><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="5s" begin="1.5s" repeatCount="indefinite"/><rect x="36" y="296" width="392" height="236" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity=".08"/><rect x="36" y="296" width="392" height="236" rx="20" fill="none" stroke="url(#edge)" stroke-width="2" stroke-dasharray="90 1256" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="0;-1346" dur="9s" begin="3.5999999999999996s" repeatCount="indefinite"/></rect><circle cx="90" cy="358" r="30" fill="#2fe0cc" opacity=".1"/><circle cx="90" cy=